## C'est quoi, la génération procédurale ?

Créer du contenu avec un **algorithme** plutôt qu'à la main.

- Des **cartes** : terrains, grottes, donjons
- Des **objets** : armes, plantes, planètes
- Des **mots** : noms, quêtes, descriptions

On n'écrit pas le niveau. On écrit **les règles** qui fabriquent des niveaux.

![](images/procgen/exemples_jeux.png style="display: block; width: 760px; height: 190px; margin: 6px auto 0")

---

## Pourquoi faire ça ?

| Avantages | Limites |
|---|---|
| **Rejouabilité** : une partie différente à chaque fois | Difficile de **contrôler** le résultat |
| **Taille** : des mondes immenses | Peut devenir **répétitif** |
| **Poids** : un algorithme plutôt que des Go de données | Plus dur à **tester** et à équilibrer |

*Elite* (1984) : 8 galaxies de 256 planètes, générées par un algorithme.

Le piège des « **10 000 bols de porridge** » : tout est différent… mais tout se ressemble.

---

## Le hasard contrôlé : la seed

L'ordinateur ne fait pas du vrai hasard : il suit une **suite de nombres** qui démarre d'une **graine** (*seed*).

```cpp
std::mt19937 rng(12345);       // la seed
int de = rng() % 6 + 1;        // toujours la même suite avec 12345
```

- **Même seed = même monde** : partager une carte = partager un nombre (Minecraft)
- Indispensable pour **déboguer** : on peut rejouer le bug

**Procédural = hasard + règles.** Le hasard seul ne donne que du bruit.

---

## Les algorithmes du cours

| | Algorithme | Pour fabriquer... |
|---|---|---|
| 0 | **Chaîne de Markov** | des noms, des mots |
| 1 | **Perlin Noise** | des terrains, des reliefs |
| 2 | **Drunkard's Walk** + **automate cellulaire** | des grottes |
| 3 | **BSP** | des donjons (salles + couloirs) |
| 4 | **Wave Function Collapse** | des cartes en tuiles |

Pour chacun : **l'idée**, **l'algorithme**, **les pièges**.

---

## 0. La chaîne de Markov

**Le problème** : inventer des noms de villes qui « sonnent » français.

**L'idée** : on donne une liste d'exemples, et l'algorithme apprend **quelle lettre suit quelle lettre**.

Notre liste : `lyon`, `lille`, `nantes`, `toulouse`, `bordeaux`... (107 villes)

On ajoute un **début** `^` et une **fin** `$` à chaque mot :

`^lyon$` → `^`→`l`, `l`→`y`, `y`→`o`, `o`→`n`, `n`→`$`

---

## Apprendre : compter les suites

Dans nos 107 villes, après la lettre `o`, on trouve :

On obtient une **table de probabilités** pour chaque lettre.

C'est **tout** l'apprentissage : compter.

---

## Générer : tirer au sort, lettre par lettre

1. On part de `^` (le début)
2. On tire la lettre suivante **selon les probabilités** de la table
3. On recommence avec la nouvelle lettre
4. On s'arrête quand on tire `$` (la fin)

```cpp
std::string name, context = "^";
while (true) {
    char next = WeightedRandom(table[context], rng);  // tirage pondéré
    if (next == '$') break;
    name += next;
    context = next;
}
```

---

## L'ordre de la chaîne

L'**ordre** = combien de lettres on regarde avant de tirer la suivante.

| Ordre | Exemples réellement générés | Verdict |
|---|---|---|
| 1 | `vigelies`, `gnereret`, `llieux` | Du charabia |
| 2 | `royon`, `seillat`, `nevere`, `cahorle` | **Crédible** |
| 3 | `angerac`, `bloissons`, `calaix` | La moitié sont de vraies villes |
| 4 | `privas`, `tulle`, `sarlat`... | Recopie la liste |

Trop bas : n'importe quoi. Trop haut : plus d'invention. **Ordre 2-3** = le bon compromis.

---

## Son cousin : la grammaire générative

On écrit des **règles** de remplacement, puis on tire au hasard dans chaque liste.

| Règle | Choix possibles |
|---|---|
| `phrase` | `#article# #nom# #adjectif#` |
| `nom` (masc.) | `chevalier`, `dragon`, `marchand` |
| `nom` (fém.) | `sorcière`, `reine`, `épée` |
| `adjectif` | `maudit / maudite`, `ancien / ancienne` |

→ « La sorcière maudite », « Le dragon ancien »

Il faut gérer l'**accord** (masculin / féminin). Outil connu : **Tracery**.

---

## Ce qu'il faut retenir

Toute génération procédurale suit la même recette :

- Des **données** ou des **règles** (la liste de villes, la grammaire)
- Du **hasard contrôlé** (la seed)
- Un **algorithme** qui combine les deux

On va retrouver cette recette dans **tous** les algorithmes qui suivent.

Le hasard pur donne de la **neige de télé**. Un vrai relief est **continu** : deux points proches ont une hauteur proche.

## Le bruit cohérent

L'idée : **peu** de valeurs aléatoires, et on **lisse** entre elles.

- On place des valeurs au hasard sur une **grille** (les points entiers)
- Entre deux points, on **interpole** avec une courbe douce
- Résultat : des bosses et des creux **naturels**

C'est le **Value Noise**. Le Perlin Noise est une version améliorée.

**Ken Perlin**, 1983, après avoir travaillé sur le film *Tron*. Oscar technique en 1997.

Au lieu d'une **valeur**, chaque coin de la grille reçoit une **direction** au hasard (un gradient).

Pour un point **P** dans la case :

1. On calcule le vecteur **coin → P** pour les 4 coins
2. **Produit scalaire** gradient · vecteur → 4 nombres
3. On **mélange** ces 4 nombres selon la position de P

Résultat : des formes plus naturelles, moins « en grille ».

---

## Perlin : l'algorithme

```cpp
float Perlin(float x, float y) {
    int x0 = std::floor(x), y0 = std::floor(y);    // coin en haut à gauche
    float fx = x - x0, fy = y - y0;                // position dans la case (0..1)
    float n00 = Dot(Gradient(x0,     y0),     fx,     fy);
    float n10 = Dot(Gradient(x0 + 1, y0),     fx - 1, fy);
    float n01 = Dot(Gradient(x0,     y0 + 1), fx,     fy - 1);
    float n11 = Dot(Gradient(x0 + 1, y0 + 1), fx - 1, fy - 1);
    float u = Fade(fx), v = Fade(fy);              // 6t⁵ - 15t⁴ + 10t³
    return Lerp(Lerp(n00, n10, u), Lerp(n01, n11, u), v);
}
```

`Fade` adoucit le mélange : sans elle, on voit les bords des cases.

---

## D'où viennent les gradients ?

Une **table de permutation** : les nombres 0 à 255 mélangés **avec la seed**.

```cpp
std::array<int, 512> perm;
std::iota(perm.begin(), perm.begin() + 256, 0);           // 0, 1, 2... 255
std::shuffle(perm.begin(), perm.begin() + 256, rng);      // mélange (seed)
for (int i = 0; i < 256; i++) perm[256 + i] = perm[i];    // doublée

Vec2 Gradient(int x, int y) {
    int h = perm[perm[x & 255] + (y & 255)];              // un « hash » du coin
    return kDirections[h & 7];                            // 8 directions
}
```

Même coin = **toujours** le même gradient. Même seed = **même** carte.

## Les octaves : le code

```cpp
float Fbm(float x, float y, int octaves) {
    float total = 0, amplitude = 1, frequency = 1, max = 0;
    for (int i = 0; i < octaves; i++) {
        total += Perlin(x * frequency, y * frequency) * amplitude;
        max += amplitude;
        amplitude *= 0.5f;    // persistance : chaque couche compte moitié moins
        frequency *= 2.0f;    // lacunarité : chaque couche est 2× plus fine
    }
    return total / max;       // on reste entre -1 et 1
}
```

- **Persistance** élevée → terrain plus **rugueux**
- Plus d'octaves → plus de **détails** (mais plus lent)

## Perlin : astuces et pièges

- **Le zoom** : `Perlin(x * 0.02f, y * 0.02f)`, sinon tout est minuscule
- **Piège** : aux coordonnées **entières**, Perlin vaut **0** ! (`Mathf.PerlinNoise(3, 7)`)
- **Île** : on retire de la hauteur selon la **distance au centre**
- **Biomes** : un 2ᵉ bruit pour l'**humidité** → désert, forêt, toundra...
- **Simplex Noise** (Perlin, 2001) : plus rapide, moins d'artefacts

Dans Unity : `Mathf.PerlinNoise` (0..1) ou `noise.cnoise` / `noise.snoise` (Unity.Mathematics).

## 2. Drunkard's Walk : la marche de l'ivrogne

On part d'une carte **pleine de murs**. Un « ivrogne » marche **au hasard** et **creuse** là où il passe.

```cpp
grid.Fill(kWall);
sf::Vector2i pos = {width / 2, height / 2};
int dug = 0, target = width * height * 0.40f;   // creuser 40 % de la carte

while (dug < target) {
    if (grid[pos] == kWall) { grid[pos] = kFloor; dug++; }
    pos += kDirections[rng() % 4];               // haut, bas, gauche, droite
    pos = Clamp(pos, 1, width - 2, 1, height - 2);
}
```

## L'automate cellulaire

Une grille où chaque case regarde **ses 8 voisines** et change selon une **règle**. Toutes les cases changent **en même temps**.

L'exemple célèbre : le **Jeu de la vie** de John Conway (1970).

Pour les grottes, la règle est simple :

- **Plus de 4** murs autour → la case devient un **mur**
- **Moins de 4** murs autour → la case devient du **sol**
- **Exactement 4** → on ne touche à rien

## L'automate cellulaire : le code

```cpp
Grid next = grid;                               // 2e grille : TRÈS important
for (int y = 0; y < height; y++)
    for (int x = 0; x < width; x++) {
        int walls = CountWallNeighbours(grid, x, y);    // les 8 voisines
        if (walls > 4)      next(x, y) = kWall;
        else if (walls < 4) next(x, y) = kFloor;
    }
grid = next;
```

- **Piège** : modifier `grid` pendant qu'on la lit → les cases déjà changées faussent les suivantes
- Une case **hors de la carte** compte comme un **mur**
- On répète **4 à 5 fois**

## Le nettoyage : le flood fill

L'automate peut quand même couper une zone. On vérifie avec un **remplissage** (comme le pot de peinture de Paint).

1. On part d'une case de sol, on « peint » toutes les cases de sol **reliées**
2. On recommence depuis une case pas encore peinte → une **2ᵉ zone**
3. On garde la **plus grande** zone, on remplit les autres de murs

Le même algorithme sert à **placer le joueur et la sortie** dans la même zone.

## 3. BSP : Binary Space Partitioning

On **coupe** la carte en deux, puis chaque moitié en deux, puis encore... On obtient un **arbre**.

## BSP : découper

```cpp
void Split(Node& node) {
    bool vertical = node.w > node.h;              // couper le côté le plus long
    int size = vertical ? node.w : node.h;
    if (size < 2 * kMinSize) return;              // trop petit : c'est une feuille
    int cut = RandomInt(kMinSize, size - kMinSize);
    if (vertical) {
        node.left  = new Node{node.x,       node.y, cut,          node.h};
        node.right = new Node{node.x + cut, node.y, node.w - cut, node.h};
    } else { /* pareil, mais avec y et h */ }
    Split(*node.left);
    Split(*node.right);
}
```

## BSP : les salles et les couloirs

**Les salles** : dans chaque **feuille**, une salle **un peu plus petite**, à une position au hasard.

**Les couloirs** : on remonte l'arbre et on relie **les deux enfants** de chaque nœud.

- On relie 1 et 2, puis 3 et 4
- Puis la moitié **gauche** et la moitié **droite**

Comme on suit l'arbre, **toutes les salles sont reliées**. Aucun flood fill nécessaire.

Un couloir en **L** : on avance en x jusqu'à la bonne colonne, puis en y.

## 4. Wave Function Collapse

Créé par **Maxim Gumin** en 2016. Utilisé dans *Caves of Qud*, *Bad North*, *Townscaper*...

**L'idée** : comme un **Sudoku**.

- Chaque case peut **tout** contenir au départ
- On fixe une case
- Les **règles** éliminent des possibilités chez les voisines
- On recommence jusqu'à ce que tout soit fixé

Le nom vient de la physique quantique : la case est en « **superposition** » jusqu'à ce qu'on la « **regarde** ».

---

## WFC : les règles de voisinage

Pour chaque tuile, on dit **qui a le droit d'être à côté**.

| | Mer | Plage | Herbe | Forêt |
|---|---|---|---|---|
| **Mer** | ✓ | ✓ | | |
| **Plage** | ✓ | ✓ | ✓ | |
| **Herbe** | | ✓ | ✓ | ✓ |
| **Forêt** | | | ✓ | ✓ |

Jamais de forêt les pieds dans l'eau : la **plage** et l'**herbe** font toujours la transition.

Pour des tuiles plus complexes (routes, tuyaux), chaque **bord** a un type : deux tuiles se touchent si leurs bords **correspondent**.

## WFC : l'algorithme

```cpp
// chaque case : la liste des tuiles encore possibles
std::vector<std::vector<int>> cells(width * height, all_tiles);

while (true) {
    int c = LowestEntropyCell(cells);   // 1. Observer
    if (c == -1) break;                 //    tout est fixé : fini !
    Collapse(cells[c], weights, rng);   // 2. Fixer UNE tuile (hasard pondéré)
    if (!Propagate(cells, c))           // 3. Propager les contraintes
        Restart();                      //    une case vide = contradiction
}
```

- **Entropie** = « combien de choix il reste ». On fixe la case **la plus sûre** d'abord
- **Poids** : plus de mer que de forêt ? On donne plus de poids à la mer

---

## WFC : propager

```cpp
std::stack<int> todo; todo.push(start);
while (!todo.empty()) {
    int c = todo.top(); todo.pop();
    for (int n : Neighbours(c)) {
        // on retire de n les tuiles qui ne vont avec AUCUNE tuile de c
        bool changed = RemoveIncompatible(cells[n], cells[c], Direction(c, n));
        if (cells[n].empty()) return false;   // contradiction !
        if (changed) todo.push(n);            // ses voisines doivent vérifier
    }
}
return true;
```

**Contradiction** : rare avec des règles simples. Sinon, on recommence (ou *backtracking*).

## WFC : deux modèles

**Simple Tiled Model** (ce qu'on fait)
- On écrit les règles **à la main**
- On choisit les tuiles et leurs voisins

**Overlapping Model**
- On donne une **image d'exemple**
- L'algorithme **découpe** l'image en petits motifs (3×3) et **apprend** les règles tout seul
- Comme la chaîne de Markov… mais en 2D !

- **Flèche verte** : « une tuile pareille ici »
- **Croix rouge** : « pas de tuile pareille ici »

Unity choisit **tout seul** le bon sprite : coin, bord, milieu...

Marche pour les cartes **faites à la main** comme pour les cartes **générées**.

## Rule Tiles + n'importe quel algorithme

```csharp
// Le générateur décide : mur ou sol ?
for (int x = 0; x < width; x++)
    for (int y = 0; y < height; y++)
        if (grid[x, y] == Wall)
            tilemap.SetTile(new Vector3Int(x, y, 0), wallRuleTile);
```

La Rule Tile décide **à quoi** ressemble chaque mur.

| | Rule Tile | Wave Function Collapse |
|---|---|---|
| Décide | **L'apparence** d'une case déjà placée | **Ce qu'il y a** dans chaque case |
| Avec | Drunkard, BSP, Perlin, à la main... | Ses propres règles |

Les deux se **complètent** : le WFC ou le BSP placent, la Rule Tile habille.

- **Perlin** : ajoutez un **masque d'île**, puis un 2ᵉ bruit pour les **biomes**

- **BSP** : placez le **départ** et la **sortie** dans les deux salles les plus éloignées
- **WFC** : ajoutez une tuile **Montagne** et des **poids**
- **Unity** : branchez un de vos générateurs sur une **Tilemap** avec une **Rule Tile**

---

## Conclusion

- Procédural = **règles** + **hasard contrôlé** (la seed)
- Chaque algorithme a ses **forces** et ses **défauts**
- Les meilleurs résultats viennent souvent d'un **mélange** d'algorithmes
- Et souvent d'un mélange avec du **fait main**

Le bon algorithme, c'est celui qui donne **le niveau que vous voulez**... pas le plus compliqué ;)

<script>
(function () {
    const cfg = window.courseConfig || {};
    const src = document.getElementById('slides-source').textContent;
    const stage = document.getElementById('stage');

    // Images au format ![](chemin style="...") : on les transforme en <img>
    function convertImages(md) {
        return md.replace(/!\[([^\]]*)\]\((\S+?)(?:\s+style="([^"]*)")?\)/g, function (_, alt, url, style) {
            style = style || '';
            return '<img src="' + url + '" alt="' + alt + '" style="' + style + '" data-file="' + url + '">';
        });
    }

    // Écran de titre
    const title = document.createElement('section');
    title.className = 'slide title-slide';
    title.innerHTML = '<h1></h1><div class="subtitle"></div><div class="instructor"></div>';
    title.querySelector('h1').textContent = cfg.title || '';
    title.querySelector('.subtitle').textContent = cfg.subtitle || '';
    title.querySelector('.instructor').textContent = cfg.instructor || '';
    stage.appendChild(title);

    // Une diapo par bloc séparé par ---
    src.split(/^\s*---\s*$/m).map(s => s.trim()).filter(Boolean).forEach(function (chunk) {
        const s = document.createElement('section');
        s.className = 'slide';
        s.innerHTML = marked.parse(convertImages(chunk));
        stage.appendChild(s);
    });

    // Image introuvable -> cadre en pointillés avec le nom du fichier
    stage.querySelectorAll('img').forEach(function (img) {
        img.addEventListener('error', function () {
            const box = document.createElement('span');
            box.className = 'img-missing';
            box.setAttribute('style', img.getAttribute('style') || '');
            box.style.minHeight = box.style.height || '5rem';
            box.textContent = 'Image à ajouter : ' + img.dataset.file;
            img.replaceWith(box);
        });
    });

    // Coloration du code + liens dans un nouvel onglet
    stage.querySelectorAll('pre code').forEach(el => { try { hljs.highlightElement(el); } catch (e) {} });
    stage.querySelectorAll('a').forEach(a => { a.target = '_blank'; });

    const slides = Array.from(stage.querySelectorAll('.slide'));
    slides.forEach(function (s, i) {
        const p = document.createElement('div');
        p.className = 'page';
        p.textContent = (i + 1) + ' / ' + slides.length;
        s.appendChild(p);
    });

    let current = Math.min(Math.max(parseInt(location.hash.slice(1), 10) - 1 || 0, 0), slides.length - 1);

    function fit() {
        const scale = Math.min(window.innerWidth / 1340, window.innerHeight / 780);
        slides.forEach(s => s.style.transform = 'scale(' + scale + ')');
    }
    function show(i) {
        current = Math.min(Math.max(i, 0), slides.length - 1);
        slides.forEach((s, k) => s.classList.toggle('active', k === current));
        document.getElementById('progress').style.width = ((current + 1) / slides.length * 100) + '%';
        history.replaceState(null, '', '#' + (current + 1));
    }

    document.addEventListener('keydown', function (e) {
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(current + 1); }
        else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(current - 1); }
        else if (e.key === 'Home') show(0);
        else if (e.key === 'End') show(slides.length - 1);
        else if (e.key === 'f' || e.key === 'F') {
            if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
        }
    });
    stage.addEventListener('click', function (e) {
        if (e.target.closest('a')) return;
        if (e.clientX < window.innerWidth / 3) show(current - 1); else show(current + 1);
    });
    window.addEventListener('resize', fit);

    fit();
    show(current);
})();
</script>
</body>
</html>
